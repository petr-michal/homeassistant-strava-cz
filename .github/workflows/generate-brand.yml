name: Generate Strava.cz brand images

on:
  push:
    paths:
      - ".github/workflows/generate-brand.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer
        run: python -m pip install --disable-pip-version-check cairosvg pillow

      - name: Download official Strava.cz logomark
        run: |
          mkdir -p /tmp/strava-brand
          curl --fail --location --retry 3             https://app.strava.cz/logo/logomark.svg             --output /tmp/strava-brand/logomark.svg

      - name: Render Home Assistant brand icons
        run: |
          python - <<'PY'
          from pathlib import Path

          import cairosvg
          from PIL import Image

          svg = Path("/tmp/strava-brand/logomark.svg")
          rendered = Path("/tmp/strava-brand/rendered.png")

          cairosvg.svg2png(
              bytestring=svg.read_bytes(),
              write_to=str(rendered),
          )

          source = Image.open(rendered).convert("RGBA")
          brand = Path("custom_components/strava_cz/brand")
          brand.mkdir(parents=True, exist_ok=True)

          for size, filename in (
              (256, "icon.png"),
              (512, "icon@2x.png"),
          ):
              image = source.copy()
              image.thumbnail((size, size), Image.Resampling.LANCZOS)
              canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              left = (size - image.width) // 2
              top = (size - image.height) // 2
              canvas.alpha_composite(image, (left, top))
              canvas.save(brand / filename, optimize=True)
          PY

      - name: Commit generated brand images
        run: |
          if git diff --quiet -- custom_components/strava_cz/brand              && git ls-files --error-unmatch custom_components/strava_cz/brand/icon.png >/dev/null 2>&1; then
            echo "Brand images are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/strava_cz/brand
          git commit -m "pridat oficialni logo strava.cz"
          git push
